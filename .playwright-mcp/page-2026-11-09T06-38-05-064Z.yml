  - generic [ref=e273]:
    - heading [level=1] [ref=e274]:
      - img "svg icon" [ref=e275]
      - text: Todos - Docs
    - paragraph [ref=e276]:
      - text: The
      - strong [ref=e277]: todos
      - text: endpoint provides a dataset of sample to-do items, including details like task descriptions, statuses, and user IDs, ideal for testing and prototyping task management and productivity applications.
    - generic [ref=e278]:
      - link "Get all todos" [ref=e279] [cursor=pointer]:
        - /url: "#todos-all"
      - paragraph [ref=e280]:
        - text: By default you will get 30 items, use
        - link "Limit and skip" [ref=e281] [cursor=pointer]:
          - /url: "#todos-limit_skip"
        - text: to paginate through all items.
      - code [ref=e283]: fetch('https://dummyjson.com/todos') .then(res => res.json()) .then(console.log);
      - button "Show Output" [ref=e284] [cursor=pointer]
      - code [ref=e285]: "{ \"todos\": [ { \"id\": 1, \"todo\": \"Do something nice for someone I care about\", \"completed\": true, \"userId\": 26 }, {...}, {...} // 30 items ], \"total\": 150, \"skip\": 0, \"limit\": 30 }"
    - generic [ref=e286]:
      - link "Get a single todo" [ref=e287] [cursor=pointer]:
        - /url: "#todos-single"
      - code [ref=e289]: fetch('https://dummyjson.com/todos/1') .then(res => res.json()) .then(console.log);
      - button "Show Output" [ref=e290] [cursor=pointer]
      - code [ref=e291]: "{ \"id\": 1, \"todo\": \"Do something nice for someone I care about\", \"completed\": true, \"userId\": 26 }"
    - generic [ref=e292]:
      - link "Get a random todo" [ref=e293] [cursor=pointer]:
        - /url: "#todos-random"
      - paragraph [ref=e294]:
        - text: The random data will change on every call to
        - generic [ref=e295]: /random
        - text: . You can optionally pass a length of max 10 as
        - generic [ref=e296]: /random/10
        - text: .
      - code [ref=e298]: fetch('https://dummyjson.com/todos/random') .then(res => res.json()) .then(console.log);
      - button "Show Output" [ref=e299] [cursor=pointer]
      - code [ref=e300]: "{ // random result, will be changed on every call to /random \"id\": 127, \"todo\": \"Prepare a dish from a foreign culture\", \"completed\": false, \"userId\": 7 }"
    - generic [ref=e301]:
      - link "Limit and skip todos" [ref=e302] [cursor=pointer]:
        - /url: "#todos-limit_skip"
      - paragraph [ref=e303]:
        - text: You can pass
        - generic [ref=e304]: limit
        - text: and
        - generic [ref=e305]: skip
        - text: params to limit and skip the results for pagination, and use
        - generic [ref=e306]: limit=0
        - text: to get all items.
      - paragraph [ref=e307]:
        - text: You can pass
        - generic [ref=e308]: select
        - text: as query params with comma-separated values to select specific data
      - code [ref=e310]: fetch('https://dummyjson.com/todos?limit=3&skip=10&select=todo,completed') .then(res => res.json()) .then(console.log);
      - button "Show Output" [ref=e311] [cursor=pointer]
      - code [ref=e312]: "{ \"todos\": [ { \"id\": 11, // first 10 items were skipped \"todo\": \"Text a friend I haven't talked to in a long time\", \"completed\": false }, { \"id\": 12, \"todo\": \"Organize pantry\", \"completed\": true }, { \"id\": 13, \"todo\": \"Buy a new house decoration\", \"completed\": false } ], \"total\": 150, \"skip\": 10, \"limit\": 3 }"
    - generic [ref=e313]:
      - link "Sort todos" [ref=e314] [cursor=pointer]:
        - /url: "#todos-sort"
      - paragraph [ref=e315]:
        - text: You can pass
        - generic [ref=e316]: sortBy
        - text: and
        - generic [ref=e317]: order
        - text: params to sort the results,
        - generic [ref=e318]: sortBy
        - text: should be field name and
        - generic [ref=e319]: order
        - text: should be "asc" or "desc"
      - code [ref=e321]: fetch('https://dummyjson.com/todos?sortBy=todo&order=asc') .then(res => res.json()) .then(console.log);
      - button "Show Output" [ref=e322] [cursor=pointer]
      - code [ref=e323]: "{ \"todos\": [ { \"id\": 181, \"todo\": \"Attend a comedy show\", // sorted by todo in ascending order \"completed\": false, \"userId\": 157 }, {...}, {...} // 30 items ], \"total\": 150, \"skip\": 0, \"limit\": 30 }"
    - generic [ref=e324]:
      - link "Get all todos by user id" [ref=e325] [cursor=pointer]:
        - /url: "#todos-user"
      - code [ref=e327]: /* getting todos of user with id 5 */ fetch('https://dummyjson.com/todos/user/5') .then(res => res.json()) .then(console.log);
      - button "Show Output" [ref=e328] [cursor=pointer]
      - code [ref=e329]: "{ \"todos\": [ { \"id\": 19, \"todo\": \"Create a compost pile\", \"completed\": true, \"userId\": 5 // user id is 5 }, {...}, {...} ], \"total\": 3, \"skip\": 0, \"limit\": 3 }"
    - generic [ref=e330]:
      - link "Add a new todo" [ref=e331] [cursor=pointer]:
        - /url: "#todos-add"
      - paragraph [ref=e332]: Adding a new todo will not add it into the server. It will simulate a POST request and will return the new created todo with a new id
      - code [ref=e334]: "fetch('https://dummyjson.com/todos/add', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ todo: 'Use DummyJSON in the project', completed: false, userId: 5, }) }) .then(res => res.json()) .then(console.log);"
      - button "Show Output" [ref=e335] [cursor=pointer]
      - code [ref=e336]: "{ \"id\": 151, \"todo\": \"Use DummyJSON in the project\", \"completed\": false, \"userId\": 5 }"
    - generic [ref=e337]:
      - link "Update a todo" [ref=e338] [cursor=pointer]:
        - /url: "#todos-update"
      - paragraph [ref=e339]: Updating a todo will not update it into the server. It will simulate a PUT/PATCH request and will return updated todo with modified data
      - code [ref=e341]: "/* updating completed status of todo with id 1 */ fetch('https://dummyjson.com/todos/1', { method: 'PUT', /* or PATCH */ headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ completed: false, }) }) .then(res => res.json()) .then(console.log);"
      - button "Show Output" [ref=e342] [cursor=pointer]
      - code [ref=e343]: "{ \"id\": \"1\", \"todo\": \"Do something nice for someone I care about\", \"completed\": false, // complete status was changed \"userId\": 26 }"
    - generic [ref=e344]:
      - link "Delete a todo" [ref=e345] [cursor=pointer]:
        - /url: "#todos-delete"
      - paragraph [ref=e346]:
        - text: Deleting a todo will not delete it into the server. It will simulate a DELETE request and will return deleted todo with
